[package]
name = "bara"
version = "0.5.0"
edition = "2021"
description = "Bara (בָּרָא) — El Lenguaje de Programación Supremo Trascendental"
license = "MIT"
repository = "https://github.com/usercardjoke1036991-star/Bara-AETHER--Engine-Final-Expansion"
readme = "README.md"
default-run = "bara"

# El núcleo vive en `src/lib.rs` para que el binario `bara` y la suite de
# integración (`tests/`) compartan exactamente los mismos tipos (cero duplicación
# del kernel).
[lib]
name = "bara"
path = "src/lib.rs"
# Sólo `rlib`. El binario se llama igual que la biblioteca (`bara`). Si este
# target también emite `cdylib`, en MSVC con LTO (`codegen-units = 1`) Cargo
# choca `bara.dll` / `bara.pdb` con `bara.exe` y `link.exe` cierra el
# ejecutable sin la rlib: LNK2019 (cargo#6313). El release de Linux no lo
# sufre; el de Windows sí, y tumba `cargo test --all-targets --release`.
# La frontera FFI (`src/ffi.rs`) sigue en esta rlib. La biblioteca compartida
# se pide aparte, sin cambiar este target:
#   cargo rustc --release --target aarch64-linux-android --lib --crate-type cdylib
# Eso produce `libbara.so` con los símbolos `bara_ffi_*`.
crate-type = ["rlib"]

[dependencies]

# ─────────────────────────────────────────────────────────────────────────
# Perfil de release — máximo rendimiento nativo (AETHER-Ω)
# ─────────────────────────────────────────────────────────────────────────
# NO se declara aquí: Cargo sólo admite `[profile.*]` en el manifiesto de la
# raíz del workspace, de modo que en este paquete (miembro del contenedor
# `../Cargo.toml`) producía el aviso «profiles for the non root package will
# be ignored» y el perfil se ignoraba realmente (LTO desactivado, `panic`
# unwind). El kernel declara su perfil en `.cargo/config.toml`, que sí se lee
# cuando `bara` es su propia raíz (CI y autohospedaje).
#
# Valores exigidos (idénticos a los de `../Cargo.toml`; la coherencia de ambos
# la verifica `scripts/check_profiles.ps1`):
#   opt-level = 3 · lto = true · codegen-units = 1 · panic = "abort"
#   * `opt-level = 3`     — optimización agresiva (vectorización, inlining).
#   * `lto = true`        — *link-time optimization*: el AST, el runtime y la
#                           malla se compilan como una única unidad.
#   * `codegen-units = 1` — elimina barreras de optimización entre unidades.
#   * `panic = "abort"`   — el kernel es total y TOLERANTE (jamás entra en
#                           pánico); abortar en vez de desenrollar recorta el
#                           *prologue* y habilita optimizaciones `nounwind`.
# ─────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────
# Fase 6 · banco de metal (arnés propio, sin `criterion`)
# ─────────────────────────────────────────────────────────────────────────
# `harness = false`: el binario es el banco, no libtest. `cargo bench` le pasa
# `--bench`; `cargo test --all-targets` lo ejecuta en modo humo (pocas muestras,
# mismas invariantes) para que la suite siga siendo verde y rápida.
[[bench]]
name = "kernel_bench"
path = "benches/kernel_bench.rs"
harness = false

